<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div id="calculator-container">
      <div id="calculator-display"></div>
      <div id="buttons-container">
        <!-- digits -->
        <button class="digits" value="7" type="button">7</button>
        <button class="digits" value="8" type="button">8</button>
        <button class="digits" value="9" type="button">9</button>
        <button class="digits" value="4" type="button">4</button>
        <button class="digits" value="5" type="button">5</button>
        <button class="digits" value="6" type="button">6</button>
        <button class="digits" value="1" type="button">1</button>
        <button class="digits" value="2" type="button">2</button>
        <button class="digits" value="3" type="button">3</button>
        <button class="digits" value="0" type="button">0</button>
        <button class="decimal" value="." type="button">.</button>
        <button class="equal" value="=" type="button">=</button>
        <!-- oparate -->
        <button class="operator" value="+" type="button">+</button>
        <button class="operator" value="-" type="button">-</button>
        <button class="operator" value="*" type="button">*</button>
        <button class="operator" value="/" type="button">/</button>
        <!-- clear  -->
        <button class="clear" value="clear" type="button">Clear</button>
      </div>
    </div>
  </body>
</html>
